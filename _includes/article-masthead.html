<a class="article-skip-link" href="#main">跳至正文</a>
<header class="article-masthead">
  <a class="article-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">{{ site.name | escape }}</a>
  <nav aria-label="站点导航">
    {% for item in site.navigation %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.categories contains 'research' and item.url == '/research/' or page.categories contains 'blog' and item.url == '/blog/' %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
